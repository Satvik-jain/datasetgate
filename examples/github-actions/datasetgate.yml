name: DatasetGate Quality Gate

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'dataset/**'
      - 'data/**'
      - 'datasetgate.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'dataset/**'
      - 'data/**'
      - 'datasetgate.yaml'
  workflow_dispatch:

jobs:
  validate-dataset:
    name: Verify Computer Vision Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install DatasetGate
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/Satvik-jain/datasetgate.git@v0.1.1"

      - name: Run DatasetGate Audit
        id: audit
        run: |
          datasetgate audit ./dataset --config datasetgate.yaml --output reports

      - name: Upload Dataset Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datasetgate-audit-report
          path: reports/
          retention-days: 30
